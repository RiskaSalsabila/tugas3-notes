steps:
  # Membuat image dengan perintah "cloud build -t gcr.io/$PROJECT_ID/tcc-be-notes-riska ."
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/tcc-be-notes-riska", "."]

  # Meng-upload/push image yg telah dibuat ke Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/tcc-be-notes-riska"]

  # Melakukan deploy ke cloud run menggunakan image yg telah di-upload/push
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "be-notes-riska",  # <-- NAMA SERVICE KAMU (Biar gak ketimpa Hafiz dkk)
        "--image",
        "gcr.io/$PROJECT_ID/tcc-be-notes-riska", # <-- NAMA IMAGE KAMU
        "--timeout",
        "1000s",
        "--port",
        "5000",
        "--region",
        "us-central1", # 
        "--allow-unauthenticated",
      ]

# Log hanya akan disimpan di Google Cloud Logging
options:
  logging: CLOUD_LOGGING_ONLY